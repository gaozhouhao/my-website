<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">INT8 NPU block-level architecture</title><desc id="desc">Descriptor frontend and tile scheduling control the DMA, operand buffers and systolic compute path. Partial sums and parameters use separate memories. Residual addition and pooling have independent datapaths sharing AXI.</desc>
